<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#303030;
 color:#eee;
 font-family:Arial,sans-serif
}

#app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column
}

.top{
 height:62px;
 min-height:62px;
 background:#292929;
 display:flex;
 align-items:center;
 gap:9px;
 padding:7px 10px
}

.logo{
 font-size:21px;
 font-weight:bold;
 white-space:nowrap
}

.filename{
 flex:1;
 min-width:80px;
 background:#202020;
 border:1px solid #444;
 border-radius:5px;
 color:#ddd;
 padding:9px;
 font-family:monospace
}

button{
 background:#383838;
 border:0;
 border-radius:5px;
 color:#eee;
 padding:9px 12px;
 font-weight:bold
}

button:active{background:#555}

.run{background:#454545}

.main{
 flex:1;
 min-height:0;
 display:flex
}

.editor{
 flex:1;
 min-width:0;
 display:flex;
 background:#303030
}

.numbers{
 width:42px;
 min-width:42px;
 padding:9px 7px 0 0;
 text-align:right;
 color:#777;
 font:15px/24px monospace;
 overflow:hidden
}

textarea{
 flex:1;
 border:0;
 outline:0;
 resize:none;
 background:#303030;
 color:#eee;
 padding:9px 10px;
 font:15px/24px monospace;
 tab-size:4;
 white-space:pre;
 caret-color:#fff
}

.terminal{
 height:145px;
 min-height:145px;
 background:#202020;
 border-top:1px solid #444;
 display:flex;
 flex-direction:column
}

.output{
 flex:1;
 overflow:auto;
 padding:8px;
 color:#ddd;
 font:12px/18px monospace
}

.tools{
 height:52px;
 min-height:52px;
 display:flex;
 overflow-x:auto;
 border-top:1px solid #383838
}

.tools button{
 min-width:58px;
 height:52px;
 border-radius:0;
 background:#292929;
 font:15px monospace
}

@media(max-width:650px){
 .top{height:58px;min-height:58px;padding:6px}
 .logo{font-size:17px}
 .top button{padding:8px}
 .terminal{height:125px;min-height:125px}
}
</style>
</head>

<body>

<div id="app">

<div class="top">
 <div class="logo">MalzPy</div>

 <input
  id="filename"
  class="filename"
  value="main.py"
  spellcheck="false">

 <button onclick="newFile()">NEW</button>
 <button onclick="Android.openFile()">OPEN</button>
 <button onclick="saveFile()">SAVE</button>
 <button onclick="saveAs()">SAVE AS</button>
 <button class="run" onclick="runCode()">RUN</button>
</div>

<div class="main">

<div class="editor">

<div id="numbers" class="numbers">1</div>

<textarea
 id="code"
 spellcheck="false"
 autocorrect="off"
 autocomplete="off"
 autocapitalize="off"></textarea>

</div>

</div>

<div class="terminal">

<div id="output" class="output">
MalzPy Python Terminal<br>
Python runtime: loading...
</div>

<div class="tools">

<button onclick="insert('    ')">Tab</button>
<button onclick="pair('{}')">{}</button>
<button onclick="pair('()')">()</button>
<button onclick="pair('[]')">[]</button>
<button onclick="pair('\"\"')">""</button>
<button onclick="insert(':')">:</button>
<button onclick="undo()">↶</button>
<button onclick="redo()">↷</button>

</div>

</div>

</div>

<script>

const editor=document.getElementById("code");
const numbers=document.getElementById("numbers");
const output=document.getElementById("output");
const filename=document.getElementById("filename");

let files={
 "main.py":"print('Hello from MalzPy')\n\nnama = 'Malz'\nprint('Halo', nama)\n\nfor i in range(5):\n    print(i)"
};

function updateNumbers(){
 let n=editor.value.split("\n").length;
 let s="";
 for(let i=1;i<=n;i++)s+=i+"\\n";
 numbers.textContent=s;
}

function insert(text){
 let a=editor.selectionStart;
 let b=editor.selectionEnd;
 editor.setRangeText(text,a,b,"end");
 editor.focus();
 updateNumbers();
}

function pair(text){
 let a=editor.selectionStart;
 let b=editor.selectionEnd;
 let selected=editor.value.substring(a,b);
 let value=selected?text[0]+selected+text[1]:text;
 editor.setRangeText(value,a,b,"end");
 editor.focus();
 updateNumbers();
}

function undo(){
 document.execCommand("undo");
 updateNumbers();
}

function redo(){
 document.execCommand("redo");
 updateNumbers();
}

function newFile(){

 let name=prompt("Nama file:","main.py");

 if(!name)return;

 if(!name.endsWith(".py"))
   name+=".py";

 files[name]="";

 filename.value=name;
 editor.value="";

 updateNumbers();
}

function saveFile(){

 files[filename.value]=editor.value;

 Android.saveFile(
   filename.value,
   editor.value
 );
}

function saveAs(){

 let name=prompt(
   "Simpan sebagai:",
   filename.value
 );

 if(!name)return;

 if(!name.endsWith(".py"))
   name+=".py";

 filename.value=name;

 files[name]=editor.value;

 Android.saveAs(
   name,
   editor.value
 );
}

window.openFromAndroid=function(name,content){

 filename.value=name;
 editor.value=content;

 files[name]=content;

 updateNumbers();

 log("Opened: "+name);
};

window.savedFromAndroid=function(){
 log("Saved: "+filename.value);
};

function log(text){

 output.innerHTML+=
   String(text)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/\n/g,"<br>")+
   "<br>";

 output.scrollTop=output.scrollHeight;
}

window.onPythonOutput=function(text){
 log(text);
};

async function runCode(){

 output.innerHTML="";

 log(">>> "+filename.value);
 log(">>> Running...");

 try{

   if(!window.runMicroPython){

     log("Python runtime belum siap.");

     return;
   }

   await window.runMicroPython(
     editor.value
   );

   log(">>> Process finished");

 }catch(e){

   log("ERROR: "+e);

 }
}

editor.addEventListener("input",updateNumbers);

editor.addEventListener("scroll",()=>{
 numbers.scrollTop=editor.scrollTop;
});

editor.addEventListener("keydown",function(e){

 if(e.key==="Tab"){
   e.preventDefault();
   insert("    ");
 }

 if(e.key==="("){
   e.preventDefault();
   pair("()");
 }

 if(e.key==="["){
   e.preventDefault();
   pair("[]");
 }

 if(e.key==="{"){
   e.preventDefault();
   pair("{}");
 }

 if(e.key==='"'){
   e.preventDefault();
   pair('""');
 }

 if(e.key==="Enter"){

   const pos=editor.selectionStart;

   const before=
     editor.value.substring(0,pos);

   const line=
     before.split("\n").pop();

   const indent=
     line.match(/^\s*/)[0];

   setTimeout(()=>{
     insert(indent);
   },0);
 }

});

editor.value=files["main.py"];

updateNumbers();

</script>

<script type="module">
import "./micropython/micropython.mjs";
</script>

</body>
</html>
