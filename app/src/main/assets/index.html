<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MalzCode</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1e1e1e;
    color:#ddd;
    font-family:Arial,sans-serif;
}

button{
    border:0;
    background:#333;
    color:#ddd;
    padding:8px 11px;
    margin:2px;
    border-radius:4px;
    font-size:12px;
}

button:active{
    background:#555;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#top{
    height:48px;
    min-height:48px;
    background:#181818;
    display:flex;
    align-items:center;
    border-bottom:1px solid #303030;
}

#logo{
    font-size:16px;
    font-weight:bold;
    padding:0 12px;
    color:#fff;
}

#filename{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#aaa;
}

#main{
    flex:1;
    min-height:0;
    display:flex;
}

#explorer{
    width:190px;
    min-width:150px;
    background:#181818;
    border-right:1px solid #303030;
    display:flex;
    flex-direction:column;
}

#explorerTitle{
    padding:12px;
    font-size:12px;
    color:#aaa;
    border-bottom:1px solid #303030;
}

#files{
    overflow:auto;
    flex:1;
}

.file{
    padding:8px 12px;
    font-family:monospace;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file.active{
    background:#37373d;
    color:#fff;
}

#workspace{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

#tabs{
    height:38px;
    min-height:38px;
    display:flex;
    background:#181818;
    overflow:auto;
}

.tab{
    min-width:110px;
    max-width:180px;
    padding:10px 12px;
    border-right:1px solid #303030;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tab.active{
    background:#1e1e1e;
    color:#fff;
}

#editorArea{
    flex:1;
    min-height:0;
    display:flex;
    background:#1e1e1e;
}

#lineNumbers{
    width:48px;
    overflow:hidden;
    text-align:right;
    padding:12px 8px 12px 0;
    color:#666;
    background:#1e1e1e;
    font-family:monospace;
    font-size:14px;
    line-height:21px;
    user-select:none;
}

#editor{
    flex:1;
    width:0;
    resize:none;
    border:0;
    outline:0;
    background:#1e1e1e;
    color:#dcdcdc;
    padding:12px;
    font-family:monospace;
    font-size:14px;
    line-height:21px;
    tab-size:4;
}

#bottom{
    height:150px;
    min-height:90px;
    background:#111;
    border-top:1px solid #333;
    display:flex;
    flex-direction:column;
}

#terminalTitle{
    height:32px;
    padding:8px 12px;
    color:#aaa;
    font-size:12px;
    border-bottom:1px solid #292929;
}

#terminal{
    flex:1;
    overflow:auto;
    padding:8px 12px;
    font-family:monospace;
    font-size:12px;
    white-space:pre-wrap;
    color:#ddd;
}

.prompt{
    color:#7bd88f;
}

.error{
    color:#ff7777;
}

#language{
    padding:0 10px;
    color:#777;
    font-family:monospace;
    font-size:11px;
}

</style>
</head>

<body>

<div id="app">

<div id="top">

<div id="logo">MalzCode</div>

<div id="filename">untitled.txt</div>

<div id="language">TEXT</div>

<button onclick="newFile()">NEW</button>
<button onclick="Android.openFile()">OPEN</button>
<button onclick="save()">SAVE</button>
<button onclick="saveAs()">SAVE AS</button>
<button onclick="runCode()">▶ RUN</button>

</div>

<div id="main">

<div id="explorer">

<div id="explorerTitle">
EXPLORER
</div>

<div id="files"></div>

</div>

<div id="workspace">

<div id="tabs"></div>

<div id="editorArea">

<div id="lineNumbers">1</div>

<textarea
id="editor"
spellcheck="false"
autocorrect="off"
autocapitalize="off"
placeholder="Start coding..."></textarea>

</div>

<div id="bottom">

<div id="terminalTitle">
TERMINAL
</div>

<div id="terminal">
<span class="prompt">$ MalzCode terminal ready</span>
</div>

</div>

</div>

</div>

</div>

<script>

const editor =
document.getElementById("editor");

const lineNumbers =
document.getElementById("lineNumbers");

const filename =
document.getElementById("filename");

const language =
document.getElementById("language");

const terminal =
document.getElementById("terminal");

const files =
document.getElementById("files");

const tabs =
document.getElementById("tabs");

let currentName = "untitled.txt";
let currentLanguage = "text";

let projectFiles = {};

function detectLanguage(name){

    let n = name.toLowerCase();

    if(n.endsWith(".py")) return "python";
    if(n.endsWith(".js")) return "javascript";
    if(n.endsWith(".html") || n.endsWith(".htm")) return "html";
    if(n.endsWith(".css")) return "css";
    if(n.endsWith(".json")) return "json";
    if(n.endsWith(".java")) return "java";
    if(n.endsWith(".c")) return "c";
    if(n.endsWith(".cpp") || n.endsWith(".cc")) return "cpp";
    if(n.endsWith(".h")) return "c/c++ header";
    if(n.endsWith(".xml")) return "xml";
    if(n.endsWith(".sh")) return "shell";
    if(n.endsWith(".sql")) return "sql";
    if(n.endsWith(".md")) return "markdown";

    return "text";
}

function updateLanguage(){

    currentLanguage =
        detectLanguage(currentName);

    language.textContent =
        currentLanguage.toUpperCase();

    filename.textContent =
        currentName;
}

function updateLines(){

    let count =
        editor.value.split("\n").length;

    let out = "";

    for(let i=1;i<=count;i++){
        out += i + "\n";
    }

    lineNumbers.textContent = out;
}

function updateTabs(){

    tabs.innerHTML = "";

    Object.keys(projectFiles).forEach(name => {

        let tab =
            document.createElement("div");

        tab.className =
            "tab" +
            (name === currentName
                ? " active"
                : "");

        tab.textContent = name;

        tab.onclick = () => {

            saveMemory();

            currentName = name;
            editor.value =
                projectFiles[name];

            updateLanguage();
            updateLines();
            updateTabs();
        };

        tabs.appendChild(tab);
    });
}

function updateExplorer(){

    files.innerHTML = "";

    Object.keys(projectFiles).forEach(name => {

        let item =
            document.createElement("div");

        item.className =
            "file" +
            (name === currentName
                ? " active"
                : "");

        item.textContent =
            "📄 " + name;

        item.onclick = () => {

            saveMemory();

            currentName = name;

            editor.value =
                projectFiles[name];

            updateLanguage();
            updateLines();
            updateExplorer();
            updateTabs();
        };

        files.appendChild(item);
    });
}

function saveMemory(){

    if(currentName){
        projectFiles[currentName] =
            editor.value;
    }
}

function newFile(){

    let name =
        prompt(
            "Nama file baru:",
            "main.py"
        );

    if(!name){
        return;
    }

    name = name.trim();

    if(!name){
        return;
    }

    if(projectFiles[name] !== undefined){

        alert("File sudah ada.");

        currentName = name;
        editor.value =
            projectFiles[name];

    }else{

        projectFiles[name] = "";

        currentName = name;

        editor.value = "";
    }

    updateLanguage();
    updateLines();
    updateExplorer();
    updateTabs();

    editor.focus();
}

function save(){

    saveMemory();

    Android.saveFile(
        currentName,
        projectFiles[currentName] || ""
    );
}

function saveAs(){

    saveMemory();

    let name =
        prompt(
            "Nama file:",
            currentName
        );

    if(!name){
        return;
    }

    name = name.trim();

    if(!name){
        return;
    }

    currentName = name;

    projectFiles[currentName] =
        editor.value;

    updateLanguage();
    updateExplorer();
    updateTabs();

    Android.saveAs(
        currentName,
        editor.value
    );
}

function terminalPrint(text, cls){

    let div =
        document.createElement("div");

    if(cls){
        div.className = cls;
    }

    div.textContent = text;

    terminal.appendChild(div);

    terminal.scrollTop =
        terminal.scrollHeight;
}

function clearTerminal(){

    terminal.innerHTML = "";

}

async function runCode(){

    saveMemory();

    clearTerminal();

    terminalPrint(
        "$ run " + currentName,
        "prompt"
    );

    if(currentLanguage === "html"){

        terminalPrint(
            "Opening HTML Preview..."
        );

        Android.showHtml(
            editor.value
        );

        return;
    }

    if(currentLanguage === "css"){

        terminalPrint(
            "CSS file tidak bisa dijalankan sendiri."
        );

        terminalPrint(
            "Buat index.html untuk preview CSS."
        );

        return;
    }

    if(currentLanguage === "javascript"){

        try{

            let output = [];

            let oldLog =
                console.log;

            console.log = function(){

                let text =
                    Array.from(arguments)
                    .join(" ");

                output.push(text);
            };

            let result =
                eval(editor.value);

            console.log =
                oldLog;

            output.forEach(x =>
                terminalPrint(x)
            );

            if(result !== undefined){

                terminalPrint(
                    String(result)
                );
            }

            terminalPrint(
                "Process finished."
            );

        }catch(e){

            terminalPrint(
                String(e),
                "error"
            );
        }

        return;
    }

    if(currentLanguage === "python"){

        await runPython();

        return;
    }

    terminalPrint(
        "Runtime untuk " +
        currentLanguage +
        " belum tersedia."
    );

    terminalPrint(
        "File tetap bisa diedit dan disimpan."
    );
}

let pyodide = null;
let pythonLoading = false;

async function loadPython(){

    if(pyodide){
        return pyodide;
    }

    if(pythonLoading){

        while(pythonLoading){
            await new Promise(
                r => setTimeout(r,100)
            );
        }

        return pyodide;
    }

    pythonLoading = true;

    terminalPrint(
        "Loading Python runtime..."
    );

    try{

        const script =
            document.createElement("script");

        script.src =
            "pyodide/pyodide.js";

        document.head.appendChild(script);

        await new Promise(
            (resolve,reject) => {

                script.onload = resolve;
                script.onerror = reject;
            }
        );

        pyodide =
            await loadPyodide({
                indexURL:
                    "pyodide/"
            });

        pyodide.setStdout({
            batched: text => {
                terminalPrint(text);
            }
        });

        pyodide.setStderr({
            batched: text => {
                terminalPrint(
                    text,
                    "error"
                );
            }
        });

        terminalPrint(
            "Python ready."
        );

        return pyodide;

    }catch(e){

        terminalPrint(
            "Python runtime gagal dimuat: " +
            e,
            "error"
        );

        pythonLoading = false;

        throw e;
    }
}

async function runPython(){

    try{

        let py =
            await loadPython();

        terminalPrint(
            "$ python " +
            currentName,
            "prompt"
        );

        await py.runPythonAsync(
            editor.value
        );

        terminalPrint(
            "Process finished."
        );

    }catch(e){

        terminalPrint(
            String(e),
            "error"
        );
    }
}

editor.addEventListener(
    "input",
    () => {

        updateLines();

        saveMemory();
    }
);

editor.addEventListener(
    "scroll",
    () => {

        lineNumbers.scrollTop =
            editor.scrollTop;
    }
);

editor.addEventListener(
    "keydown",
    event => {

        if(event.key === "Tab"){

            event.preventDefault();

            let start =
                editor.selectionStart;

            let end =
                editor.selectionEnd;

            editor.value =
                editor.value.substring(
                    0,
                    start
                ) +
                "    " +
                editor.value.substring(
                    end
                );

            editor.selectionStart =
                editor.selectionEnd =
                start + 4;

            updateLines();
            saveMemory();
        }

        if(event.key === "("){

            insertPair("(", ")");
            event.preventDefault();
        }

        if(event.key === "["){

            insertPair("[", "]");
            event.preventDefault();
        }

        if(event.key === "{"){

            insertPair("{", "}");
            event.preventDefault();
        }

        if(event.key === "\""){

            insertPair("\"", "\"");
            event.preventDefault();
        }

        if(event.key === "'"){

            insertPair("'", "'");
            event.preventDefault();
        }
    }
);

function insertPair(a,b){

    let start =
        editor.selectionStart;

    let end =
        editor.selectionEnd;

    let selected =
        editor.value.substring(
            start,
            end
        );

    editor.value =
        editor.value.substring(
            0,
            start
        ) +
        a +
        selected +
        b +
        editor.value.substring(
            end
        );

    editor.selectionStart =
        start + 1;

    editor.selectionEnd =
        end + 1;

    updateLines();
    saveMemory();
}

window.openFromAndroid =
function(name,content){

    currentName = name;

    projectFiles[name] =
        content;

    editor.value =
        content;

    updateLanguage();
    updateLines();
    updateExplorer();
    updateTabs();

    Android.toast(
        "File dibuka"
    );
};

window.savedFromAndroid =
function(){

    Android.toast(
        "Tersimpan"
    );
};

projectFiles["untitled.txt"] = "";

updateLanguage();
updateLines();
updateExplorer();
updateTabs();

</script>

</body>
</html>
