<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>MalzPy</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0f12;
    color:#eee;
    font-family:Arial,sans-serif;
}

button{
    border:1px solid #30343b;
    background:#171a1f;
    color:#eee;
    border-radius:7px;
    padding:9px 11px;
    font-weight:bold;
}

button:active{
    background:#292e36;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#top{
    min-height:56px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px;
    background:#12151a;
    border-bottom:1px solid #2a2e35;
}

.logo{
    font-size:18px;
    font-weight:bold;
    color:#fff;
    white-space:nowrap;
}

.logo span{
    color:#ffd21f;
}

#filename{
    flex:1;
    min-width:60px;
    background:#0b0d10;
    border:1px solid #30343b;
    color:#fff;
    border-radius:7px;
    padding:9px;
}

#run{
    background:#ffd21f;
    color:#111;
}

#editorArea{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

#numbers{
    width:42px;
    overflow:hidden;
    padding-top:12px;
    background:#101216;
    color:#666;
    text-align:right;
    padding-right:8px;
    font:14px monospace;
    line-height:22px;
    user-select:none;
}

#editor{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    padding:10px;
    background:#0d0f12;
    color:#eee;
    font:14px monospace;
    line-height:22px;
    white-space:pre;
    overflow:auto;
}

#terminal{
    height:145px;
    overflow:auto;
    background:#080a0c;
    border-top:1px solid #30343b;
    padding:10px;
    color:#d7d7d7;
    font:13px monospace;
    white-space:pre-wrap;
}

#tools{
    display:flex;
    gap:5px;
    padding:6px;
    overflow-x:auto;
    background:#12151a;
    border-top:1px solid #2a2e35;
}

#tools button{
    min-width:44px;
}

#status{
    padding:4px 8px;
    font-size:11px;
    color:#888;
    background:#0b0d10;
}

@media(max-width:500px){
    #top button{
        padding:8px;
        font-size:11px;
    }

    .logo{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="top">
        <div class="logo">Malz<span>Py</span></div>

        <input
            id="filename"
            value="main.py"
            autocomplete="off">

        <button onclick="newFile()">NEW</button>
        <button onclick="openFile()">OPEN</button>
        <button onclick="saveFile()">SAVE</button>
        <button id="run" onclick="runCode()">RUN</button>
    </div>

    <div id="editorArea">

        <div id="numbers">1</div>

        <textarea
            id="editor"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            oninput="updateLines()"
            onscroll="syncScroll()"
            onkeydown="editorKey(event)"
        >print("Hello from MalzPy")
</textarea>

    </div>

    <div id="terminal">MalzPy terminal
Python runtime sedang dimuat...</div>

    <div id="status">Loading...</div>

    <div id="tools">
        <button onclick="insertText('    ')">Tab</button>
        <button onclick="insertText('{}')">{}</button>
        <button onclick="insertText('()')">()</button>
        <button onclick="insertText('[]')">[]</button>
        <button onclick="insertText('""')">""</button>
        <button onclick="insertText(':')">:</button>
        <button onclick="document.execCommand('undo')">↶</button>
        <button onclick="document.execCommand('redo')">↷</button>
    </div>

</div>

<script type="module">

let mp = null;
let pythonReady = false;

const terminal = document.getElementById("terminal");
const editor = document.getElementById("editor");
const filename = document.getElementById("filename");
const statusEl = document.getElementById("status");

function output(text){
    terminal.textContent += String(text);
    terminal.scrollTop = terminal.scrollHeight;
}

window.onPythonOutput = function(text){
    output(text);
};

async function loadPython(){

    try{

        statusEl.textContent = "Memuat Python...";

        const module =
            await import("./micropython/micropython.mjs");

        mp = await module.loadMicroPython({
            linebuffer:true,
            stdout:(text)=>{
                output(text);
            },
            stderr:(text)=>{
                output(text);
            }
        });

        pythonReady = true;

        statusEl.textContent =
            "Python siap • offline";

        terminal.textContent =
            "MalzPy terminal\nPython siap.\n";

    }catch(e){

        pythonReady = false;

        statusEl.textContent =
            "Python gagal dimuat";

        terminal.textContent =
            "Gagal memuat MicroPython:\n" +
            String(e);
    }
}

window.runMicroPython = async function(code){

    if(!mp){
        throw new Error("Python runtime belum siap.");
    }

    return await mp.runPython(code);
};

loadPython();

</script>

<script>

const editor =
    document.getElementById("editor");

const numbers =
    document.getElementById("numbers");

const filename =
    document.getElementById("filename");

const terminal =
    document.getElementById("terminal");

const statusEl =
    document.getElementById("status");

let currentFile = null;

function updateLines(){

    const count =
        editor.value.split("\n").length;

    let html = "";

    for(let i=1;i<=count;i++){
        html += i + "<br>";
    }

    numbers.innerHTML = html;

    statusEl.textContent =
        currentFile ?
        "Editing " + currentFile :
        "New file";
}

function syncScroll(){

    numbers.scrollTop =
        editor.scrollTop;
}

function openFile(){

    Android.openFile();
}

function saveFile(){

    let name =
        filename.value.trim();

    if(!name){
        name = "main.py";
    }

    if(!name.toLowerCase().endsWith(".py")){
        name += ".py";
    }

    filename.value = name;

    Android.saveFile(
        name,
        editor.value
    );
}

function newFile(){

    const name =
        prompt(
            "Masukkan nama file Python:",
            "main.py"
        );

    if(name === null){
        return;
    }

    let n =
        name.trim();

    if(!n){
        alert("Nama file tidak boleh kosong.");
        return;
    }

    if(!n.toLowerCase().endsWith(".py")){
        n += ".py";
    }

    currentFile = null;

    filename.value = n;
    editor.value = "";

    terminal.textContent =
        "MalzPy terminal\nFile baru: " + n;

    statusEl.textContent =
        "New file • " + n;

    updateLines();

    editor.focus();
}

async function runCode(){

    const code =
        editor.value;

    if(!code.trim()){
        terminal.textContent =
            "Tidak ada kode.";
        return;
    }

    terminal.textContent =
        "MalzPy terminal\nMenjalankan...\n";

    statusEl.textContent =
        "Running Python...";

    try{

        if(!window.runMicroPython){
            throw new Error(
                "Runtime Python belum dimuat."
            );
        }

        await window.runMicroPython(code);

        statusEl.textContent =
            "Selesai";

    }catch(e){

        output("\nError: " + e);

        statusEl.textContent =
            "Python error";
    }
}

function insertText(text){

    const start =
        editor.selectionStart;

    const end =
        editor.selectionEnd;

    editor.value =
        editor.value.substring(0,start) +
        text +
        editor.value.substring(end);

    editor.selectionStart =
        editor.selectionEnd =
        start + text.length;

    updateLines();
    editor.focus();
}

function editorKey(e){

    if(e.key === "Tab"){

        e.preventDefault();

        insertText("    ");

        return;
    }

    const pairs = {
        "(":")",
        "[":"]",
        "{":"}",
        "\"":"\"",
        "'":"'"
    };

    if(pairs[e.key]){

        e.preventDefault();

        const close =
            pairs[e.key];

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        const selected =
            editor.value.substring(
                start,
                end
            );

        editor.value =
            editor.value.substring(0,start) +
            e.key +
            selected +
            close +
            editor.value.substring(end);

        editor.selectionStart =
            start + 1;

        editor.selectionEnd =
            end + 1;

        updateLines();

        return;
    }

    if(e.key === "Enter"){

        const pos =
            editor.selectionStart;

        const before =
            editor.value.substring(
                0,
                pos
            );

        const line =
            before.substring(
                before.lastIndexOf("\n") + 1
            );

        const indent =
            line.match(/^\s*/)[0];

        const extra =
            /:\s*$/.test(line)
            ? "    "
            : "";

        setTimeout(()=>{
            const p =
                editor.selectionStart;

            editor.value =
                editor.value.substring(0,p) +
                indent +
                extra +
                editor.value.substring(p);

            editor.selectionStart =
                editor.selectionEnd =
                p + indent.length + extra.length;

            updateLines();
        },0);
    }
}

window.openFromAndroid =
function(name, content){

    if(!name.toLowerCase().endsWith(".py")){
        showAndroidError(
            "Hanya file .py yang bisa dibuka."
        );
        return;
    }

    currentFile = name;

    filename.value = name;
    editor.value = content;

    terminal.textContent =
        "MalzPy terminal\nOpened: " + name;

    statusEl.textContent =
        "Opened " + name;

    updateLines();
};

window.saveCurrentContent =
function(){

    if(!filename.value.toLowerCase().endsWith(".py")){
        filename.value += ".py";
    }

    Android.saveFile(
        filename.value,
        editor.value
    );
};

window.savedFromAndroid =
function(){

    currentFile =
        filename.value;

    statusEl.textContent =
        "Saved " + currentFile;

    terminal.textContent +=
        "\nSaved: " + currentFile;
};

window.showAndroidError =
function(message){

    terminal.textContent +=
        "\nError: " + message;

    statusEl.textContent =
        "Error";
};

function output(text){

    terminal.textContent +=
        String(text);

    terminal.scrollTop =
        terminal.scrollHeight;
}

updateLines();

</script>

</body>
</html>
