plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.malz.py"
    compileSdk 34

    defaultConfig {
        applicationId "com.malz.py"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

dependencies {
}
