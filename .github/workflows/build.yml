name: Build MalzCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Python Runtime
        run: |
          set -e

          mkdir -p app/src/main/assets/pyodide

          wget -q \
            https://github.com/pyodide/pyodide/releases/download/0.29.5/pyodide-0.29.5.tar.bz2 \
            -O /tmp/pyodide.tar.bz2

          tar -xjf /tmp/pyodide.tar.bz2 \
            -C app/src/main/assets/pyodide \
            --strip-components=1

          rm -f /tmp/pyodide.tar.bz2

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4096m

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalzCode-debug
          path: app/build/outputs/apk/debug/app-debug.apk
