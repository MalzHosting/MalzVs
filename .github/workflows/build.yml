name: Build MalzPy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /opt/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            echo "Mencari Android SDK..."
            find /usr/local/lib/android /opt/android-sdk "$HOME" -type f -name sdkmanager 2>/dev/null | head -30
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          SDK_ROOT=$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

      - name: Build MalzPy
        run: |
          gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Check APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi

          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")
          MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")

          echo "Ukuran APK: ${MB} MB"

          if [ "$SIZE" -ge $((100 * 1024 * 1024)) ]; then
            echo "APK >= 100 MB"
            exit 1
          fi

      - name: Upload MalzPy APK
        uses: actions/upload-artifact@v4
        with:
          name: MalzPy
          path: app/build/outputs/apk/debug/*.apk
